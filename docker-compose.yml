services:

  Gateway:
    build:
      content: .
      dockerfile: gateway/Dockerfile

      ports: 
        - "8000:8000"

      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_started

      env_file:
        - gateway/.env

      network: 
        - insertion-remote


  Initializer:
    build:
      context: .
      dockerfile: apps/initializer/Dockerfile

    ports:
      - "8002:8002"

    env_file:
      - apps/initializer/.env

    networks:
      - insertion-remote


  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: insertion
      POSTGRES_USER: insertion
      POSTGRES_PASSWORD: insertion

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U experimentos -d experimentos"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - insertion-remote


  redis:
    image: redis:8

    ports:
      - "6379:6379"

    networks:
      - insertion-remote



volumes:
  postgres_data:


networks:
  insertion-remote:
    driver: bridge